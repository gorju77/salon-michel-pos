<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salón Michel - POS V1 Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Salón Michel - POS V1 Pro</span>
        <span class="text-white">Usuario: <strong>{{ usuario }}</strong> | <a href="/logout" class="text-danger text-decoration-none ms-2">Salir</a></span>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card p-3 shadow-sm mb-3">
                    <h5>Registrar Cobro / Servicio</h5>
                    <div class="row g-2 mt-2">
                        <div class="col-md-6">
                            <input type="text" id="cliente" class="form-control" placeholder="Nombre del Cliente (Opcional)">
                        </div>
                        <div class="col-md-4">
                            <input type="number" id="total" class="form-control" placeholder="Monto Total ($)">
                        </div>
                        <div class="col-md-2">
                            <button onclick="cobrar()" class="btn btn-success w-100">Cobrar</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm text-center">
                    <h6 class="text-muted">Respaldo de Información</h6>
                    <span class="badge bg-success my-2">Respaldos Automáticos Cloud Activos</span>
                    <small class="text-muted">Sus ventas se sincronizan automáticamente en tiempo real.</small>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function cobrar() {
            const cliente = document.getElementById('cliente').value || 'Cliente General';
            const total = parseFloat(document.getElementById('total').value);

            if (!total || total <= 0) {
                alert('Por favor ingrese un monto válido.');
                return;
            }

            const response = await fetch('/api/ventas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cliente, total })
            });

            if (response.ok) {
                alert('Venta registrada con éxito');
                document.getElementById('total').value = '';
                document.getElementById('cliente').value = '';
            } else {
                alert('Error al registrar venta');
            }
        }
    </script>
</body>
</html>
