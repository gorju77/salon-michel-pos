<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salón Michel - Acceso POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 text-center">
                        <h3 class="fw-bold mb-3 text-primary">Salón Michel</h3>
                        <p class="text-muted small">Sistema POS V1 Pro</p>
                        <form method="POST">
                            <div class="mb-3 text-start">
                                <label class="form-label">Usuario</label>
                                <input type="text" name="username" class="form-control" required placeholder="Ej. admin">
                            </div>
                            <div class="mb-3 text-start">
                                <label class="form-label">Contraseña</label>
                                <input type="password" name="password" class="form-control" required placeholder="••••••••">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-bold">Ingresar al POS</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
